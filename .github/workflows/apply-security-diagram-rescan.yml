name: apply-security-diagram-rescan

on:
  push:
    branches: [docs/diagram-rescan-fix]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/diagram-rescan-fix
      - name: Add required supply-chain security dependency to Mermaid
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          old = '    SAST[CodeQL] --> SG[Security / security-gate]\n'
          new = '    SUPPLY[Supply-chain policy] --> SG[Security / security-gate]\n    SAST[CodeQL] --> SG\n'
          if s.count(old) != 1:
              raise SystemExit('expected one security gate fragment')
          s = s.replace(old, new, 1)
          old_class = '    class CIG,EG,DG,SAST,AUDIT,TRIVY,REVIEW,SG gate;\n'
          new_class = '    class CIG,EG,DG,SUPPLY,SAST,AUDIT,TRIVY,REVIEW,SG gate;\n'
          if s.count(old_class) != 1:
              raise SystemExit('expected one security class fragment')
          p.write_text(s.replace(old_class, new_class, 1), encoding='utf-8')
      - name: Commit Mermaid correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git diff --cached --check
          git commit -m 'docs: show supply-chain policy in security diagram'
          git push origin HEAD:docs/diagram-rescan-fix

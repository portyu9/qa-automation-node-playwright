name: apply-diagram-rescan

on:
  push:
    branches: [docs/diagram-rescan-fix]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: docs/diagram-rescan-fix
      - name: Correct required Node compatibility convergence in Mermaid architecture
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          old = '    JEST --> CIG[CI / ci-gate]\n    EV --> CIG\n\n    CHANGE --> EXT[Chromium · Firefox · WebKit]\n'
          new = '    JEST --> CIG[CI / ci-gate]\n    EV --> CIG\n    CHANGE --> NODE22[Node 22 fast + discovery compatibility]\n    NODE22 --> CIG\n\n    CHANGE --> EXT[Chromium · Firefox · WebKit]\n'
          if s.count(old) != 1:
              raise SystemExit('expected one CI convergence fragment')
          s = s.replace(old, new, 1)
          old_class = '    class PW,WEB,FIX,EXT runtime;\n'
          new_class = '    class PW,WEB,FIX,NODE22,EXT runtime;\n'
          if s.count(old_class) != 1:
              raise SystemExit('expected one runtime class fragment')
          s = s.replace(old_class, new_class, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit README correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git diff --cached --check
          git commit -m 'docs: show required Node compatibility in Mermaid diagram'
          git push origin HEAD:docs/diagram-rescan-fix

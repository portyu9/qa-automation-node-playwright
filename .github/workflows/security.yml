name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NPM_VERSION: 11.19.1

jobs:
  supply-chain-policy:
    name: Supply-chain policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up current Node LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Validate runtime and repository-owned policy code
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(node --version)" == "v$(cat .nvmrc)" ]]
          node .github/scripts/validate_workflow_pins.js
          node --check .github/scripts/validate_test_evidence.js
          node --check .github/scripts/validate_security_evidence.js
          python3 -m py_compile .github/scripts/validate_codeql_sarif.py .github/scripts/validate_codeql_sarif_selfcheck.py .github/scripts/validate_security_stack.py
          python3 .github/scripts/validate_codeql_sarif_selfcheck.py
          python3 .github/scripts/validate_security_stack.py

  codeql:
    name: CodeQL
    needs: [supply-chain-policy]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate zero-alert security implementation
        run: |
          python3 -m py_compile .github/scripts/validate_codeql_sarif.py .github/scripts/validate_codeql_sarif_selfcheck.py .github/scripts/validate_security_stack.py
          python3 .github/scripts/validate_codeql_sarif_selfcheck.py
          python3 .github/scripts/validate_security_stack.py
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript,python,actions
          queries: security-extended
      - name: Analyze
        id: analyze-source
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          output: reports/security/codeql-source
      - name: Enforce zero CodeQL alerts
        env:
          SARIF_DIR: ${{ steps.analyze-source.outputs.sarif-output }}
        run: python3 .github/scripts/validate_codeql_sarif.py "$SARIF_DIR"
      - name: Upload CodeQL SARIF evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ github.run_id }}
          path: reports/security/codeql-source/
          if-no-files-found: error
          retention-days: 14

  npm-audit:
    name: npm audit
    needs: [supply-chain-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up current Node LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin and verify Node/npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(node --version)" == "v$(cat .nvmrc)" ]]
          npm install --global --ignore-scripts --no-audit --no-fund "npm@${NPM_VERSION}"
          [[ "$(npm --version)" == "$NPM_VERSION" ]]
      - name: Audit npm dependency graph at HIGH/CRITICAL severity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/security/npm
          set +e
          npm audit --audit-level=high --json > reports/security/npm/audit.json
          audit_status=$?
          set -e
          node .github/scripts/validate_security_evidence.js npm-audit reports/security/npm/audit.json
          node - <<'NODE' | tee reports/security/npm/summary.md >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('reports/security/npm/audit.json', 'utf8'));
          const dependencies = report.metadata.dependencies;
          const vulnerabilities = report.metadata.vulnerabilities;
          console.log('### npm advisory gate');
          console.log('');
          console.log(`- Dependency graph: ${dependencies.total} total / ${dependencies.dev} development dependencies`);
          console.log(`- Gated advisories: HIGH=${vulnerabilities.high ?? 0}, CRITICAL=${vulnerabilities.critical ?? 0}`);
          console.log(`- npm: ${process.env.NPM_VERSION}`);
          console.log('- Scope: committed npm lock graph including development dependencies used to execute the framework');
          NODE
          exit "$audit_status"
      - name: Upload npm audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-evidence-${{ github.run_id }}
          path: reports/security/npm/
          if-no-files-found: error
          retention-days: 14

  trivy:
    name: Trivy
    needs: [supply-chain-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare evidence directory
        run: mkdir -p reports/security/trivy
      - name: Scan dependencies, configuration, and repository secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: reports/security/trivy/trivy.json
          exit-code: "1"
      - name: Require attributed Trivy evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/validate_security_evidence.js trivy reports/security/trivy/trivy.json
          npm_packages=$(jq '[.Results[]? | select(.Type == "npm" or ((.Target // "") | contains("package-lock.json"))) | .Packages[]?] | length' reports/security/trivy/trivy.json)
          playwright_version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          vulnerabilities=$(jq '[.Results[]? | .Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' reports/security/trivy/trivy.json)
          misconfigurations=$(jq '[.Results[]? | .Misconfigurations[]?] | length' reports/security/trivy/trivy.json)
          secrets=$(jq '[.Results[]? | .Secrets[]?] | length' reports/security/trivy/trivy.json)
          {
            echo '### Trivy security gate'
            echo
            echo "- Attributed npm packages: ${npm_packages}"
            echo "- Locked Playwright represented: ${playwright_version}"
            echo "- Fixed HIGH/CRITICAL vulnerabilities: ${vulnerabilities}"
            echo "- HIGH/CRITICAL misconfigurations: ${misconfigurations}"
            echo "- Gated secret findings: ${secrets}"
            echo '- Scanner: Trivy v0.74.0 with development dependencies enabled'
            echo '- Fail-closed policy: valid scanner/version evidence, substantive npm inventory, exact governed package attribution, and zero gated findings are required'
          } | tee reports/security/trivy/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Trivy security evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-security-evidence-${{ github.run_id }}
          path: reports/security/trivy/
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: dependency-review
    needs: [supply-chain-policy]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe the actual PR Dependency Review API (not retiring SBOM export)
        id: dependency-graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::Missing immutable PR base/head SHAs for dependency review probe.'
            exit 1
          }
          response="$RUNNER_TEMP/dependency-review-diff.json"
          auth_headers="$RUNNER_TEMP/dependency-review-auth-headers.txt"
          diff_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/compare/$BASE_SHA...$HEAD_SHA"
          # Keep only sanitized GitHub-generated request IDs, never response headers or credentials.
          request_id() {
            [[ -f "$1" ]] || return 0
            awk 'tolower($0) ~ /^x-github-request-id:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub(/\r/, ""); print}' "$1" \
              | tail -n 1 | tr -cd '[:alnum:]:-' | cut -c 1-100
          }
          if ! status="$(curl --silent --show-error --max-time 20 --retry 2 \
            --dump-header "$auth_headers" \
            --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            "$diff_url")"; then
            echo '::error::Dependency Review API request failed at the transport layer; refusing false-green fallback.'
            exit 1
          fi
          if [[ "$status" == 200 ]]; then
            jq -e 'type == "array"' "$response" >/dev/null || {
              echo '::error::Dependency Review API returned 200 without an array of dependency changes.'
              exit 1
            }
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Actual PR dependency comparison API is available; enforcing change-aware Dependency Review.'
          elif [[ "$status" == 403 || "$status" == 404 ]]; then
            message="$(jq -r 'if type == "object" then (.message // "unspecified") else "non-JSON API error" end' "$response" 2>/dev/null | tr '\n' ' ' | cut -c 1-200 || true)"
            if [[ "${message,,}" == *"rate limit"* || "${message,,}" == *"abuse detection"* ]]; then
              echo "::error::Dependency Review API rate-limited the probe (HTTP $status); refusing to interpret transient failure as disabled coverage."
              exit 1
            fi
            # Diagnostic only: public, non-fork repositories should allow an
            # anonymous dependency diff. Never use this result to authorize
            # the official review action or to change the security gate outcome.
            anonymous_headers="$RUNNER_TEMP/dependency-review-anonymous-headers.txt"
            anonymous_body="$RUNNER_TEMP/dependency-review-anonymous-body.json"
            anonymous_status="transport-error"
            if candidate="$(curl --silent --show-error --max-time 20 --retry 1 \
              --dump-header "$anonymous_headers" \
              --output "$anonymous_body" --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2026-03-10' \
              "$diff_url")"; then
              anonymous_status="$candidate"
            fi
            authenticated_request_id="$(request_id "$auth_headers")"
            anonymous_request_id="$(request_id "$anonymous_headers")"
            [[ -n "$authenticated_request_id" ]] || authenticated_request_id="not-provided"
            [[ -n "$anonymous_request_id" ]] || anonymous_request_id="not-provided"
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Dependency Review authenticated diff returned HTTP $status: $message. Anonymous HTTP $anonymous_status; authenticated request $authenticated_request_id, anonymous request $anonymous_request_id. Change-aware review unavailable; npm Audit and Trivy remain independent, not equivalent."
            {
              echo '### Dependency Review degraded mode'
              echo
              echo "- Exact PR dependency diff, authenticated GITHUB_TOKEN (contents:read): HTTP $status; GitHub request ID: $authenticated_request_id."
              echo "- Same exact public diff, anonymous diagnostic: HTTP $anonymous_status; GitHub request ID: $anonymous_request_id."
              echo '- Anonymous diagnostic cannot replace the official authenticated Dependency Review action. This check is **degraded** until the action executes successfully.'
              echo '- Independent npm Audit and attributed Trivy still gate committed lockfiles; they are not equivalent to change-aware review.'
              echo '- Diagnose repository service/feature state and use the sanitized GitHub request IDs when escalating to GitHub Support; do not broaden token privileges without evidence.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Unexpected Dependency Review API status HTTP $status; refusing false-green fallback."
            exit 1
          fi
      - name: Review dependency changes
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Confirm repository-wide fallback gates
        if: steps.dependency-graph.outputs.available != 'true'
        run: echo 'Dependency Review service unavailable; npm Audit and attributed Trivy remain independent required jobs in this workflow.'

  security-gate:
    name: security-gate
    if: always()
    needs: [supply-chain-policy, codeql, npm-audit, trivy, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Evaluate security jobs
        env:
          SUPPLY_CHAIN: ${{ needs.supply-chain-policy.result }}
          CODEQL: ${{ needs.codeql.result }}
          NPM_AUDIT: ${{ needs.npm-audit.result }}
          TRIVY: ${{ needs.trivy.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          EVENT: ${{ github.event_name }}
          SAME_REPOSITORY_PR: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUPPLY_CHAIN" == "success" ]] || { echo "supply-chain-policy=$SUPPLY_CHAIN"; exit 1; }
          [[ "$NPM_AUDIT" == "success" ]] || { echo "npm-audit=$NPM_AUDIT"; exit 1; }
          [[ "$TRIVY" == "success" ]] || { echo "trivy=$TRIVY"; exit 1; }

          if [[ "$SAME_REPOSITORY_PR" == "true" ]]; then
            [[ "$CODEQL" == "success" ]] || { echo "codeql=$CODEQL"; exit 1; }
          else
            [[ "$CODEQL" == "skipped" ]] || { echo "fork-codeql=$CODEQL"; exit 1; }
          fi

          if [[ "$EVENT" == "pull_request" ]]; then
            [[ "$DEPENDENCY_REVIEW" == "success" ]] || { echo "dependency-review=$DEPENDENCY_REVIEW"; exit 1; }
          else
            [[ "$DEPENDENCY_REVIEW" == "skipped" ]] || { echo "dependency-review=$DEPENDENCY_REVIEW"; exit 1; }
          fi

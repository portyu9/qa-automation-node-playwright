name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_HEADLESS: "true"
  TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependency graph with reviewed lifecycle scripts only
        run: npm ci --no-audit --no-fund
      - name: Confirm no unreviewed install scripts remain
        run: |
          npm install-scripts ls --json > reports-install-scripts.json
          node - <<'NODE'
          const fs = require('node:fs');
          const pending = JSON.parse(fs.readFileSync('reports-install-scripts.json', 'utf8'));
          const count = Array.isArray(pending) ? pending.length : Object.keys(pending).length;
          if (count !== 0) {
            throw new Error(`Unreviewed dependency install scripts remain: ${JSON.stringify(pending)}`);
          }
          NODE
      - name: Lint JavaScript
        run: npm run lint
      - name: Run fast contracts with coverage
        run: npm run test:unit:coverage
      - name: Validate meaningful fast-layer coverage evidence
        run: node .github/scripts/validate_test_evidence.js jest-coverage reports/jest-coverage/coverage-summary.json
      - name: Validate Playwright discovery contract
        run: npm run test:list
      - name: Publish fast-layer observability summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const coveragePath = 'reports/jest-coverage/coverage-summary.json';
          let coverage = 'unavailable';
          if (fs.existsSync(coveragePath)) {
            const total = JSON.parse(fs.readFileSync(coveragePath, 'utf8')).total;
            coverage = `lines ${total.lines.pct}% (${total.lines.covered}/${total.lines.total}), branches ${total.branches.pct}% (${total.branches.covered}/${total.branches.total})`;
          }
          const summary = [
            '### Jest + Playwright discovery · Node 24 LTS',
            '',
            `- Run ID: \`${process.env.TEST_RUN_ID}\``,
            `- Job status: \`${process.env.JOB_STATUS}\``,
            '- Scope: strict reviewed install scripts + lint + unit/API/data/framework contracts + scoped Jest coverage + Playwright discovery',
            '- Coverage floor: 60% lines/statements, 55% branches, 50% functions',
            `- Coverage: ${coverage}`,
            '',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE
      - name: Upload fast-layer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-fast-evidence
          path: reports/jest-coverage/
          if-no-files-found: error
          retention-days: 14

  node22-compatibility:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependency graph
        run: npm ci --no-audit --no-fund
      - name: Run Node 22 fast compatibility contracts
        run: npm run test:unit
      - name: Validate Playwright discovery on Node 22
        run: npm run test:list
      - name: Publish Node 22 compatibility summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '### Maintenance-LTS compatibility · Node 22'
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Job status: \`${JOB_STATUS}\`"
            echo '- Scope: Jest fast contracts + Playwright discovery after current-LTS install-script policy passes'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    needs: [quality, node22-compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_BASE_URL: http://127.0.0.1:3001
      TEST_API_BASE_URL: http://127.0.0.1:3001
      TEST_BROWSER: chromium
      NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependency graph with reviewed lifecycle scripts only
        run: npm ci --no-audit --no-fund
      - name: Install Chromium and operating-system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run Chromium E2E gate against repository-owned fixture
        run: npm run test:chromium
      - name: Validate Playwright JUnit evidence
        run: node .github/scripts/validate_test_evidence.js playwright-junit reports/playwright-junit.xml
      - name: Publish browser observability summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p reports
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = {
            schemaVersion: 1,
            framework: 'playwright',
            runId: process.env.TEST_RUN_ID,
            dimension: { node: '24.20.0', browser: 'chromium', target: 'local-fixture' },
            status: process.env.JOB_STATUS,
            sha: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
          };
          fs.writeFileSync('reports/ci-observability.json', `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          {
            echo '### Playwright · Chromium · Node 24 LTS'
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Job status: \`${JOB_STATUS}\`"
            echo '- Target: repository-owned loopback fixture'
            echo '- Evidence: validated JUnit + HTML + trace/screenshot/video on failure + runtime diagnostics + CI observability envelope'
          } | tee reports/ci-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-evidence
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14

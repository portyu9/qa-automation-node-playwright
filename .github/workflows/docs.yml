name: docs

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Validate README and workflow contracts
        run: python .github/scripts/validate_readme.py
      - name: Validate immutable workflow dependencies
        run: node .github/scripts/validate_workflow_pins.js
      - name: Validate repository-owned evidence policy code
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(node --version)" == "v$(cat .nvmrc)" ]]
          node --check .github/scripts/validate_test_evidence.js
          node --check .github/scripts/validate_security_evidence.js

name: extended

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/scripts/**"
      - "config/**"
      - "mock/**"
      - "src/pages/**"
      - "tests/e2e/**"
      - "tests/fixtures/**"
      - ".nvmrc"
      - "playwright.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/extended.yml"
  schedule:
    - cron: "53 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-lts-cross-browser:
    name: Node 24 / ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      TEST_BASE_URL: http://127.0.0.1:3001
      TEST_API_BASE_URL: http://127.0.0.1:3001
      TEST_BROWSER: ${{ matrix.browser }}
      TEST_HEADLESS: "true"
      TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-node24-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependency graph
        run: npm ci --no-audit --no-fund
      - name: Install Playwright engine and operating-system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run ${{ matrix.browser }} E2E contract against repository-owned fixture
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Validate Playwright JUnit evidence
        run: node .github/scripts/validate_test_evidence.js playwright-junit reports/playwright-junit.xml
      - name: Publish browser observability summary
        if: always()
        run: |
          mkdir -p "reports/extended-node24-${{ matrix.browser }}"
          {
            echo "### Playwright · ${{ matrix.browser }} · Node 24 LTS"
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Browser project: \`${{ matrix.browser }}\`"
            echo '- Runtime: `.nvmrc` current-LTS pin'
            echo '- Target: repository-owned loopback fixture'
            echo "- Job status: \`${{ job.status }}\`"
            echo '- Evidence: validated JUnit + HTML + trace/screenshot/video on failure + bounded runtime diagnostics'
          } | tee "reports/extended-node24-${{ matrix.browser }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload cross-browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-node24-${{ matrix.browser }}-extended-evidence
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14

  node22-browser-compatibility:
    name: Node 22 / chromium compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TEST_BASE_URL: http://127.0.0.1:3001
      TEST_API_BASE_URL: http://127.0.0.1:3001
      TEST_BROWSER: chromium
      TEST_HEADLESS: "true"
      TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-node22-chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependency graph
        run: npm ci --no-audit --no-fund
      - name: Install Chromium and operating-system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run Chromium browser compatibility contract
        run: npx playwright test --project=chromium
      - name: Validate Playwright JUnit evidence
        run: node .github/scripts/validate_test_evidence.js playwright-junit reports/playwright-junit.xml
      - name: Publish maintenance-LTS browser summary
        if: always()
        run: |
          mkdir -p reports/extended-node22-chromium
          {
            echo '### Playwright · Chromium · Node 22 maintenance LTS'
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Job status: \`${{ job.status }}\`"
            echo '- Target: repository-owned loopback fixture'
            echo '- Purpose: prove browser execution on the oldest supported Node LTS line'
            echo '- Evidence: validated JUnit + HTML + trace/screenshot/video on failure + bounded runtime diagnostics'
          } | tee reports/extended-node22-chromium/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload maintenance-LTS browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-node22-chromium-extended-evidence
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14

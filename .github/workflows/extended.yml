name: extended

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "config/**"
      - "src/pages/**"
      - "tests/e2e/**"
      - "tests/fixtures/**"
      - "playwright.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/extended.yml"
  schedule:
    - cron: "53 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      TEST_BASE_URL: https://example.com
      TEST_BROWSER: ${{ matrix.browser }}
      TEST_HEADLESS: "true"
      TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install Playwright engine and operating-system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run ${{ matrix.browser }} E2E contract
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Publish browser observability summary
        if: always()
        run: |
          mkdir -p "reports/extended-${{ matrix.browser }}"
          {
            echo "### Playwright · ${{ matrix.browser }}"
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Browser project: \`${{ matrix.browser }}\`"
            echo "- Node: \`22\`"
            echo "- Job status: \`${{ job.status }}\`"
            echo "- Evidence: HTML/JUnit + trace/screenshot/video + bounded runtime-diagnostics attachment"
          } | tee "reports/extended-${{ matrix.browser }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload cross-browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.browser }}-extended-evidence
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

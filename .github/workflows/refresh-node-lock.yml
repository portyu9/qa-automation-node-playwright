name: finalize-node-audit

on:
  push:
    branches: [audit/node24-quality-evidence]
    paths:
      - ".github/workflows/refresh-node-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-node-audit
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NPM_CONFIG_STRICT_ALLOW_SCRIPTS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/node24-quality-evidence
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Update runtime and evidence documentation contracts
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          function replaceRequired(text, from, to, label) {
            if (!text.includes(from)) {
              throw new Error(`Expected ${label} text was not found`);
            }
            return text.replace(from, to);
          }

          let readme = fs.readFileSync('README.md', 'utf8');
          readme = replaceRequired(
            readme,
            '| Security | JavaScript SAST, dependency/configuration/secret risk, and PR dependency-change risk | CodeQL + Trivy + Dependency Review when GitHub Dependency graph is available | CodeQL result, Trivy JSON/summary, dependency-review status |',
            '| Security | JavaScript SAST, npm advisory risk, dependency/configuration/secret risk, and PR dependency-change risk | CodeQL + npm Audit + Trivy + Dependency Review when GitHub Dependency graph is available | CodeQL result, npm audit JSON, Trivy JSON/summary, dependency-review status |',
            'security capability row',
          );
          readme = replaceRequired(
            readme,
            'Node.js 22+ is required.',
            'Node.js 22 and 24 are the supported runtime lines. Node 24 is the primary current-LTS runtime and is pinned by `.nvmrc`; Node 22 remains an explicit maintenance-LTS compatibility line. Other majors are intentionally outside the declared `>=22 <25` engine range.',
            'quick-start runtime statement',
          );
          readme = replaceRequired(
            readme,
            '- `ci.yml` — Node compatibility, Jest contracts, primary Chromium.\n- `extended.yml` — Chromium/Firefox/WebKit compatibility.\n- `security.yml` — CodeQL JavaScript/TypeScript SAST, independent Trivy HIGH/CRITICAL filesystem/dependency/configuration/secret scanning, and pull-request Dependency Review when GitHub Dependency graph is available.',
            '- `ci.yml` — Node 24 current-LTS lint/Jest coverage/Playwright discovery, Node 22 fast compatibility, and the required Node 24 Chromium browser gate. Coverage evidence is validated as non-empty before retention.\n- `extended.yml` — Node 24 Chromium/Firefox/WebKit compatibility plus a real Node 22 Chromium browser contract; JUnit evidence must contain executed tests.\n- `security.yml` — CodeQL JavaScript/TypeScript SAST, npm Audit HIGH/CRITICAL advisory gating, independent Trivy HIGH/CRITICAL filesystem/dependency/configuration/secret scanning, and pull-request Dependency Review when GitHub Dependency graph is available.',
            'CI topology',
          );
          readme = replaceRequired(
            readme,
            'When GitHub Dependency graph is unavailable, the PR security workflow records that limitation and the independent Trivy job remains a required repository-wide fallback gate. Trivy is not presented as equivalent to Dependency Review: enable Dependency graph in repository security settings to restore change-aware dependency-diff analysis.',
            'When GitHub Dependency graph is unavailable, the PR security workflow records that limitation and the independent npm Audit and Trivy jobs remain required repository-wide gates. Neither is presented as equivalent to change-aware Dependency Review; enable Dependency graph in repository security settings to restore dependency-diff analysis.',
            'dependency-review fallback',
          );
          readme = replaceRequired(
            readme,
            '- Actions are treated as executable supply-chain dependencies, not static YAML decoration;\n- automated PRs must still clear unit/browser/security/docs gates and be reviewed for release-note, browser, Node, and transitive-impact changes.\n\nDependabot complements lockfile reproducibility, CodeQL, Dependency Review, and Trivy; none of those controls replaces the others.',
            '- Actions are treated as executable supply-chain dependencies, not static YAML decoration;\n- direct framework dependencies are exact-pinned and the lockfile remains the reproducible complete graph;\n- npm 11 strict lifecycle-script policy permits only the reviewed package/version script entries declared in `allowScripts`; a new or changed install script fails current-LTS installation until explicitly reviewed;\n- npm Audit independently gates HIGH/CRITICAL advisories in the committed graph;\n- automated PRs must still clear unit/browser/security/docs gates and be reviewed for release-note, browser, Node, lifecycle-script, and transitive-impact changes.\n\nDependabot complements lockfile reproducibility, strict lifecycle-script approval, npm Audit, CodeQL, Dependency Review, and Trivy; none of those controls replaces the others.',
            'dependency maintenance policy',
          );
          fs.writeFileSync('README.md', readme);

          let architecture = fs.readFileSync('docs/ARCHITECTURE.md', 'utf8');
          architecture = replaceRequired(
            architecture,
            'Primary CI executes Jest on the supported Node matrix, validates Playwright discovery, then runs Chromium against the repository fixture. Extended CI runs Chromium, Firefox, and WebKit against the same local target.',
            'Primary CI uses Node 24 as the current-LTS quality/runtime anchor: strict reviewed lifecycle-script installation, lint, scoped Jest coverage, evidence validation, Playwright discovery, and Chromium execution all run there. Node 22 remains an explicit compatibility line for fast contracts/discovery. Extended CI runs Chromium, Firefox, and WebKit on Node 24 and also runs a real Chromium browser contract on Node 22 against the same local target.',
            'architecture CI boundary',
          );
          fs.writeFileSync('docs/ARCHITECTURE.md', architecture);

          let strategy = fs.readFileSync('docs/TEST_STRATEGY.md', 'utf8');
          strategy = replaceRequired(
            strategy,
            '- Jest contracts pass on the supported Node matrix;',
            '- Node 24 current-LTS quality gates pass, including lint, scoped Jest coverage, evidence validation, and Playwright discovery;\n- Node 22 fast compatibility contracts and Playwright discovery pass;',
            'test-strategy Node matrix exit criterion',
          );
          strategy = replaceRequired(
            strategy,
            '- Chromium passes required browser execution;\n- Firefox/WebKit pass when extended coverage applies;',
            '- Chromium passes required browser execution on Node 24;\n- Firefox/WebKit pass on Node 24 when extended coverage applies;\n- Node 22 Chromium passes when extended compatibility coverage applies;\n- retained JUnit/coverage evidence is structurally non-empty and corresponds to executed tests/measured source;',
            'test-strategy browser exit criteria',
          );
          fs.writeFileSync('docs/TEST_STRATEGY.md', strategy);
          NODE
      - name: Prove locked install and reviewed lifecycle scripts
        run: |
          npm ci --no-audit --no-fund
          npm install-scripts ls --json > /tmp/install-scripts.json
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/install-scripts.json', 'utf8'));
          if (!Array.isArray(report.allowScripts) || report.allowScripts.length !== 0) {
            throw new Error(`Unreviewed install scripts remain: ${JSON.stringify(report)}`);
          }
          NODE
      - name: Run fast quality and documentation contracts
        run: |
          npm run check
          python .github/scripts/validate_readme.py
          git diff --check
      - name: Audit npm graph at HIGH/CRITICAL threshold
        run: npm audit --audit-level=high
      - name: Remove temporary finalizer and commit validated documentation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-node-lock.yml
          python .github/scripts/validate_readme.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/ARCHITECTURE.md docs/TEST_STRATEGY.md .github/workflows/refresh-node-lock.yml
          git commit -m 'docs: align Node runtime and evidence contracts'
          git push origin HEAD:audit/node24-quality-evidence

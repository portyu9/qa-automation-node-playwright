name: reference-mermaid-polish

on:
  push:
    branches: [docs/reference-quality-mermaid]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/reference-quality-mermaid
      - name: Replace architecture diagram only
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          diagram = '''flowchart LR
              CHANGE[Repository change] --> JEST[Jest fast contracts]
              CHANGE --> PW[Playwright Test]
              PW --> WEB[Native webServer]
              WEB --> FIX[Repository fixture]
              PW --> PAGE[Page objects]
              PW --> ROUTE[Scoped route sandbox]
              PW --> CTX[Browser + request contexts]
              PW --> DIAG[Bounded diagnostics]
              DIAG --> EV[Native + structured evidence]
              JEST --> CIG[CI / ci-gate]
              EV --> CIG

              CHANGE --> EXT[Chromium · Firefox · WebKit]
              EXT --> FIX
              EXT --> EG[Extended / extended-gate]

              CHANGE --> DOCS[README + workflow contracts]
              DOCS --> DG[Docs / readme-contract]

              SAST[CodeQL] --> SG[Security / security-gate]
              AUDIT[npm Audit] --> SG
              TRIVY[Trivy] --> SG
              REVIEW[Dependency Review when available] --> SG

              CIG --> RESULT[Qualified repository change]
              EG --> RESULT
              DG --> RESULT
              SG --> RESULT

              classDef entry fill:#ddf4ff,stroke:#0969da,color:#24292f,stroke-width:1.5px;
              classDef policy fill:#fbefff,stroke:#8250df,color:#24292f,stroke-width:1.5px;
              classDef runtime fill:#fff8c5,stroke:#9a6700,color:#24292f,stroke-width:1.5px;
              classDef evidence fill:#dafbe1,stroke:#1a7f37,color:#24292f,stroke-width:1.5px;
              classDef gate fill:#ffebe9,stroke:#cf222e,color:#24292f,stroke-width:1.5px;
              class CHANGE entry;
              class JEST,PAGE,ROUTE,CTX,DOCS policy;
              class PW,WEB,FIX,EXT runtime;
              class DIAG,EV,RESULT evidence;
              class CIG,EG,DG,SAST,AUDIT,TRIVY,REVIEW,SG gate;
              linkStyle default stroke:#57606a,stroke-width:1.4px;'''
          diagram = '\n'.join(line[14:] if line.startswith('              ') else line for line in diagram.splitlines())
          pattern = re.compile(r'(## Architecture\n\n```mermaid\n)(.*?)(\n```)', re.S)
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one Architecture Mermaid block, found {len(matches)}')
          path.write_text(pattern.sub(lambda m: m.group(1) + diagram + m.group(3), text, count=1), encoding='utf-8')
      - name: Commit reference-quality Mermaid diagram
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/reference-mermaid-polish.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md .github/workflows/reference-mermaid-polish.yml
          git diff --cached --check
          git commit -m 'docs: elevate README architecture diagram'
          git push origin HEAD:docs/reference-quality-mermaid

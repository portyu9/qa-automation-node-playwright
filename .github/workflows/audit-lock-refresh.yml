name: audit-lock-refresh

on:
  push:
    branches: [audit/qualify-node-engine-lines]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/qualify-node-engine-lines
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Pin npm runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --ignore-scripts npm@11.19.1 --no-audit --no-fund
          [[ "$(npm --version)" == "11.19.1" ]]
      - name: Refresh lockfile root metadata without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify engine contract and commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const expected = '>=22 <23 || >=24 <25';
          if (pkg.engines?.node !== expected) throw new Error(`package engine mismatch: ${pkg.engines?.node}`);
          if (lock.packages?.['']?.engines?.node !== expected) throw new Error(`lock engine mismatch: ${lock.packages?.['']?.engines?.node}`);
          NODE
          git diff --exit-code -- package.json
          git diff -- package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile metadata change required.'
            exit 0
          fi
          git commit -m 'chore: refresh Node engine lock metadata'
          git push origin HEAD:audit/qualify-node-engine-lines

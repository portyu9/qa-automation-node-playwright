version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    rebase-strategy: auto
    allow:
      - dependency-type: direct
    groups:
      # Separate native install-script approval from routine dependency changes.
      native-build-dependencies:
        patterns: ["better-sqlite3"]
        update-types: ["minor", "patch"]
      routine-dependencies:
        patterns: ["*"]
        exclude-patterns: ["better-sqlite3"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      routine-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
      include: "scope"
